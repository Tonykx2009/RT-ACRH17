name: Build OpenWrt for RT-ACRH17

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget

      - name: Clone OpenWrt v25.12.6
        run: |
          git clone https://github.com/openwrt/openwrt.git --branch v25.12.6 --depth 1 openwrt
          cd openwrt

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load custom config
        run: |
          cp configs/.config openwrt/.config
          cd openwrt
          make defconfig

      - name: Modify LAN IP to 192.168.50.1
        run: |
          cd openwrt
          sed -i 's/192.168.1.1/192.168.50.1/g' package/base-files/files/bin/config_generate

      - name: Download packages
        run: |
          cd openwrt
          make download -j8

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Prepare release files
        run: |
          mkdir -p release
          find openwrt/bin/targets/ipq40xx/generic -maxdepth 1 -type f \( -name "*.bin" -o -name "*.img" -o -name "*.manifest" \) -exec cp {} release/ \;

      - name: Upload to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v25.12.6-rt-acrh17
          name: "OpenWrt v25.12.6 for RT-ACRH17"
          files: release/*
          token: ${{ secrets.GITHUB_TOKEN }}
